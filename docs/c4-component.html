<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veil — C4 Level 3: Component Diagram (pool.move)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #e0e0e0;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 40px 20px;
  }
  h1 { font-size: 1.4rem; font-weight: 600; color: #00ff88; margin-bottom: 8px; letter-spacing: 0.05em; }
  .subtitle { font-size: 0.8rem; color: #666; margin-bottom: 40px; letter-spacing: 0.1em; text-transform: uppercase; }
  svg { max-width: 1200px; width: 100%; }
  .legend { margin-top: 32px; display: flex; gap: 32px; font-size: 0.75rem; color: #888; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 8px; }
  .legend-swatch { width: 16px; height: 16px; border-radius: 3px; border: 1px solid #333; }
</style>
</head>
<body>
<h1>Veil — Component Diagram: Move Modules</h1>
<p class="subtitle">C4 Level 3 &mdash; pool.move + compliance.move + verifier.move + token.move</p>

<svg viewBox="0 0 1200 950" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00ff88"/>
    </marker>
    <marker id="arr-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff4444"/>
    </marker>
    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4488ff"/>
    </marker>
    <marker id="arr-purple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#bb66ff"/>
    </marker>
    <marker id="arr-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff9900"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="950" fill="url(#grid)"/>

  <!-- Module boundary -->
  <rect x="30" y="20" width="1140" height="910" rx="8" fill="none" stroke="#00ff88" stroke-width="2"/>
  <text x="60" y="50" fill="#00ff88" font-size="14" font-weight="700">veil package</text>
  <text x="210" y="50" fill="#555" font-size="10">4 modules — pool (538L), compliance (408L), verifier (73L), token (44L)</text>

  <!-- ═══════════════ SHARED OBJECTS ═══════════════ -->

  <!-- Pool shared object -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="500" height="200" rx="6" fill="#0f1f15" stroke="#00cc66" stroke-width="1.5"/>
    <text x="250" y="28" text-anchor="middle" fill="#00cc66" font-size="15" font-weight="700">Pool</text>
    <text x="250" y="46" text-anchor="middle" fill="#555" font-size="10">[Shared Object — has key]</text>
    <line x1="15" y1="56" x2="485" y2="56" stroke="#1a2a1f" stroke-width="0.5"/>

    <text x="20" y="78" fill="#888" font-size="10">id: UID</text>
    <text x="280" y="78" fill="#555" font-size="9">Object identity + dynamic field parent</text>
    <text x="20" y="96" fill="#00ff88" font-size="10">balance: Balance&lt;TOKEN&gt;</text>
    <text x="280" y="96" fill="#555" font-size="9">Shielded pool liquidity</text>
    <text x="20" y="114" fill="#bb66ff" font-size="10">transfer_vk / withdraw_vk</text>
    <text x="280" y="114" fill="#555" font-size="9">Groth16 VKs (timelocked updates)</text>
    <text x="20" y="132" fill="#ffcc00" font-size="10">threshold: u64</text>
    <text x="280" y="132" fill="#555" font-size="9">KYC-free epoch limit</text>
    <text x="20" y="150" fill="#ff4444" font-size="10">frozen: bool + frozen_at_epoch</text>
    <text x="280" y="150" fill="#555" font-size="9">Emergency stop + 1-epoch delay</text>
    <text x="20" y="168" fill="#888" font-size="10">epoch_duration_ms: u64</text>
    <text x="280" y="168" fill="#555" font-size="9">Configurable per pool (min 60s)</text>
    <text x="20" y="186" fill="#888" font-size="10">pending_vk/withdraw_vk/compliance/withdrawal</text>
    <text x="280" y="186" fill="#555" font-size="9">All timelocked with 1-epoch delay</text>
  </g>

  <!-- AdminCap -->
  <g transform="translate(620, 80)">
    <rect x="0" y="0" width="260" height="100" rx="6" fill="#1f0f0f" stroke="#ff4444" stroke-width="1.5"/>
    <text x="130" y="28" text-anchor="middle" fill="#ff4444" font-size="14" font-weight="700">AdminCap</text>
    <text x="130" y="46" text-anchor="middle" fill="#555" font-size="10">[Owned Object — key only, no store]</text>
    <line x1="15" y1="56" x2="245" y2="56" stroke="#2a1a1a" stroke-width="0.5"/>
    <text x="20" y="76" fill="#888" font-size="10">id: UID</text>
    <text x="20" y="94" fill="#ff6666" font-size="10">pool_id: ID</text>
    <text x="110" y="94" fill="#555" font-size="9">Bound to specific pool</text>
  </g>

  <!-- ═══════════════ DYNAMIC FIELDS ═══════════════ -->

  <!-- NullifierKey -->
  <g transform="translate(620, 210)">
    <rect x="0" y="0" width="260" height="86" rx="6" fill="#0f0f1f" stroke="#4488ff" stroke-width="1.5"/>
    <text x="130" y="26" text-anchor="middle" fill="#4488ff" font-size="13" font-weight="600">NullifierKey</text>
    <text x="130" y="44" text-anchor="middle" fill="#555" font-size="9">[Dynamic Field: copy, drop, store]</text>
    <line x1="15" y1="52" x2="245" y2="52" stroke="#1a1a2f" stroke-width="0.5"/>
    <text x="20" y="70" fill="#888" font-size="10">bytes: vector&lt;u8&gt; -> bool</text>
    <text x="130" y="82" text-anchor="middle" fill="#555" font-size="8">Poseidon(2, secret, epoch, randOld) = spent</text>
  </g>

  <!-- CommitmentKey -->
  <g transform="translate(920, 210)">
    <rect x="0" y="0" width="240" height="86" rx="6" fill="#0f0f1f" stroke="#44ccff" stroke-width="1.5"/>
    <text x="120" y="26" text-anchor="middle" fill="#44ccff" font-size="13" font-weight="600">CommitmentKey</text>
    <text x="120" y="44" text-anchor="middle" fill="#555" font-size="9">[Dynamic Field: copy, drop, store]</text>
    <line x1="15" y1="52" x2="225" y2="52" stroke="#1a1a2f" stroke-width="0.5"/>
    <text x="20" y="70" fill="#888" font-size="10">bytes: vector&lt;u8&gt; -> bool</text>
    <text x="120" y="82" text-anchor="middle" fill="#555" font-size="8">UTXO: consumed on spend, created on receive</text>
  </g>

  <!-- ═══════════════ ENTRY FUNCTIONS ═══════════════ -->

  <!-- deposit_and_register -->
  <g transform="translate(60, 330)">
    <rect x="0" y="0" width="320" height="100" rx="6" fill="#0a150f" stroke="#00ff88" stroke-width="1"/>
    <text x="160" y="24" text-anchor="middle" fill="#00ff88" font-size="13" font-weight="600">deposit_and_register()</text>
    <text x="160" y="42" text-anchor="middle" fill="#555" font-size="9">[public entry]</text>
    <line x1="10" y1="50" x2="310" y2="50" stroke="#1a2a1f" stroke-width="0.5"/>
    <text x="15" y="66" fill="#888" font-size="9">1. Assert !frozen, coin >= MIN_DEPOSIT</text>
    <text x="15" y="80" fill="#888" font-size="9">2. Register genesis commitment (anti-griefing)</text>
    <text x="15" y="94" fill="#888" font-size="9">3. Join coin into pool balance</text>
  </g>

  <!-- deposit -->
  <g transform="translate(60, 450)">
    <rect x="0" y="0" width="320" height="86" rx="6" fill="#0a150f" stroke="#00ff88" stroke-width="1"/>
    <text x="160" y="24" text-anchor="middle" fill="#00ff88" font-size="13" font-weight="600">deposit()</text>
    <text x="160" y="42" text-anchor="middle" fill="#555" font-size="9">[public entry]</text>
    <line x1="10" y1="50" x2="310" y2="50" stroke="#1a2a1f" stroke-width="0.5"/>
    <text x="15" y="66" fill="#888" font-size="9">1. Assert !frozen, coin >= MIN_DEPOSIT</text>
    <text x="15" y="80" fill="#888" font-size="9">2. Join coin into pool balance</text>
  </g>

  <!-- shielded_transfer (the big one) -->
  <g transform="translate(420, 330)">
    <rect x="0" y="0" width="380" height="260" rx="6" fill="#0a1515" stroke="#00ff88" stroke-width="2"/>
    <text x="190" y="24" text-anchor="middle" fill="#00ff88" font-size="14" font-weight="700">shielded_transfer()</text>
    <text x="190" y="42" text-anchor="middle" fill="#555" font-size="9">[public entry — core proof pipeline]</text>
    <line x1="10" y1="52" x2="370" y2="52" stroke="#1a2a1f" stroke-width="0.5"/>

    <text x="15" y="72" fill="#ff4444" font-size="10">1.</text>
    <text x="30" y="72" fill="#ccc" font-size="10">Assert !frozen</text>

    <text x="15" y="92" fill="#ff9900" font-size="10">2.</text>
    <text x="30" y="92" fill="#ccc" font-size="10">Assert inputs.length() == 192</text>

    <text x="15" y="112" fill="#888" font-size="10">3.</text>
    <text x="30" y="112" fill="#ccc" font-size="10">Apply pending VK (if epoch passed)</text>

    <text x="15" y="132" fill="#ffcc00" font-size="10">4.</text>
    <text x="30" y="132" fill="#ccc" font-size="10">Check threshold matches pool</text>

    <text x="15" y="152" fill="#ffcc00" font-size="10">5.</text>
    <text x="30" y="152" fill="#ccc" font-size="10">Check epoch matches Clock</text>

    <text x="15" y="172" fill="#bb66ff" font-size="10">6.</text>
    <text x="30" y="172" fill="#ccc" font-size="10">Groth16 verify (via verifier.move)</text>

    <text x="15" y="192" fill="#44ccff" font-size="10">7.</text>
    <text x="30" y="192" fill="#ccc" font-size="10">Consume old commitment (UTXO)</text>

    <text x="15" y="212" fill="#4488ff" font-size="10">8.</text>
    <text x="30" y="212" fill="#ccc" font-size="10">Check nullifier not spent</text>

    <text x="15" y="232" fill="#4488ff" font-size="10">9.</text>
    <text x="30" y="232" fill="#ccc" font-size="10">Store nullifier</text>

    <text x="15" y="252" fill="#44ccff" font-size="10">10.</text>
    <text x="38" y="252" fill="#ccc" font-size="10">Create new commitment</text>
  </g>

  <!-- zk_withdraw -->
  <g transform="translate(60, 560)">
    <rect x="0" y="0" width="320" height="120" rx="6" fill="#0a1515" stroke="#00ff88" stroke-width="2"/>
    <text x="160" y="24" text-anchor="middle" fill="#00ff88" font-size="13" font-weight="700">zk_withdraw()</text>
    <text x="160" y="42" text-anchor="middle" fill="#555" font-size="9">[public — ZK-proven, no admin needed]</text>
    <line x1="10" y1="50" x2="310" y2="50" stroke="#1a2a1f" stroke-width="0.5"/>
    <text x="15" y="66" fill="#888" font-size="9">1. Verify Groth16 withdraw proof</text>
    <text x="15" y="80" fill="#888" font-size="9">2. Consume commitment (UTXO)</text>
    <text x="15" y="94" fill="#888" font-size="9">3. Check nullifier, amount &lt;= cumulative</text>
    <text x="15" y="108" fill="#888" font-size="9">4. Transfer to recipient (bound by proof)</text>
  </g>

  <!-- ═══════════════ ADMIN FUNCTIONS ═══════════════ -->

  <!-- freeze / unfreeze -->
  <g transform="translate(840, 330)">
    <rect x="0" y="0" width="300" height="100" rx="6" fill="#1a0f0f" stroke="#ff4444" stroke-width="1"/>
    <text x="150" y="24" text-anchor="middle" fill="#ff4444" font-size="13" font-weight="600">freeze_pool() / unfreeze_pool()</text>
    <text x="150" y="42" text-anchor="middle" fill="#555" font-size="9">[public entry — AdminCap gated]</text>
    <line x1="10" y1="50" x2="290" y2="50" stroke="#2a1a1a" stroke-width="0.5"/>
    <text x="15" y="68" fill="#888" font-size="9">Sets pool.frozen = true/false</text>
    <text x="15" y="84" fill="#888" font-size="9">Emits FreezeEvent</text>
  </g>

  <!-- propose_vk_update -->
  <g transform="translate(840, 455)">
    <rect x="0" y="0" width="300" height="110" rx="6" fill="#1a0f1a" stroke="#bb66ff" stroke-width="1"/>
    <text x="150" y="24" text-anchor="middle" fill="#bb66ff" font-size="13" font-weight="600">propose_vk_update()</text>
    <text x="150" y="42" text-anchor="middle" fill="#555" font-size="9">[public entry — AdminCap gated]</text>
    <line x1="10" y1="50" x2="290" y2="50" stroke="#2a1a2a" stroke-width="0.5"/>
    <text x="15" y="68" fill="#888" font-size="9">1. Store new_vk in pending_vk</text>
    <text x="15" y="84" fill="#888" font-size="9">2. Set effective epoch = current + 1</text>
    <text x="15" y="100" fill="#888" font-size="9">3. Applied on next shielded_transfer</text>
  </g>

  <!-- ═══════════════ INTERNAL HELPERS ═══════════════ -->

  <g transform="translate(60, 700)">
    <rect x="0" y="0" width="1080" height="110" rx="6" fill="#0f0f0f" stroke="#333" stroke-width="1"/>
    <text x="540" y="24" text-anchor="middle" fill="#888" font-size="13" font-weight="600">Internal Helpers</text>
    <line x1="15" y1="34" x2="1065" y2="34" stroke="#222" stroke-width="0.5"/>

    <text x="30" y="56" fill="#666" font-size="11" font-weight="500">pool_epoch(pool, clock)</text>
    <text x="30" y="72" fill="#555" font-size="9">timestamp_ms / pool.epoch_duration_ms</text>

    <text x="250" y="56" fill="#666" font-size="11" font-weight="500">apply_pending_vk / withdraw_vk</text>
    <text x="250" y="72" fill="#555" font-size="9">VK timelock enforcement (lazy)</text>

    <text x="520" y="56" fill="#666" font-size="11" font-weight="500">le_bytes_to_u64(data, offset)</text>
    <text x="520" y="72" fill="#555" font-size="9">Little-endian byte extraction</text>

    <text x="770" y="56" fill="#666" font-size="11" font-weight="500">extract_bytes(data, start, end)</text>
    <text x="770" y="72" fill="#555" font-size="9">Byte slice extraction</text>

    <text x="30" y="96" fill="#666" font-size="11" font-weight="500">assert_pool_admin(cap, pool)</text>
    <text x="30" y="96" fill="#555" font-size="9"></text>

    <text x="250" y="96" fill="#666" font-size="11" font-weight="500">assert_upper_bytes_zero(data, start, end)</text>
    <text x="520" y="96" fill="#666" font-size="11" font-weight="500">all_zero(data)</text>
  </g>

  <!-- ═══════════════ EVENTS ═══════════════ -->

  <g transform="translate(60, 840)">
    <rect x="0" y="0" width="1080" height="70" rx="6" fill="#0f0f0a" stroke="#ffcc00" stroke-width="1"/>
    <text x="40" y="24" fill="#ffcc00" font-size="13" font-weight="600">Events</text>
    <text x="130" y="24" fill="#555" font-size="9">[Privacy-preserving — no sender/recipient/amount leaked]</text>
    <line x1="15" y1="34" x2="1065" y2="34" stroke="#2a2a1a" stroke-width="0.5"/>
    <text x="30" y="56" fill="#ccc" font-size="10">DepositEvent { pool_id }</text>
    <text x="270" y="56" fill="#ccc" font-size="10">TransferEvent { nullifier, new_commitment }</text>
    <text x="590" y="56" fill="#ccc" font-size="10">WithdrawEvent { pool_id }</text>
    <text x="790" y="56" fill="#ccc" font-size="10">VKUpdateProposedEvent</text>
    <text x="980" y="56" fill="#ccc" font-size="10">FreezeEvent</text>
  </g>

  <!-- ═══════════════ RELATIONSHIP ARROWS ═══════════════ -->

  <!-- AdminCap -> Pool -->
  <line x1="620" y1="130" x2="560" y2="130" stroke="#ff4444" stroke-width="1" marker-end="url(#arr-red)"/>
  <text x="580" y="122" fill="#ff4444" font-size="8" text-anchor="middle">binds to</text>

  <!-- Pool -> NullifierKey -->
  <line x1="560" y1="240" x2="620" y2="245" stroke="#4488ff" stroke-width="1" marker-end="url(#arr-blue)"/>
  <text x="585" y="234" fill="#4488ff" font-size="8" text-anchor="middle">owns</text>

  <!-- Pool -> CommitmentKey -->
  <line x1="560" y1="260" x2="920" y2="260" stroke="#44ccff" stroke-width="1" marker-end="url(#arr-blue)"/>
  <text x="740" y="254" fill="#44ccff" font-size="8" text-anchor="middle">owns (UTXO lifecycle)</text>

  <!-- shielded_transfer -> verifier.move (external call label) -->
  <rect x="420" y="620" width="380" height="60" rx="4" fill="#1f0f1f" stroke="#bb66ff" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="610" y="640" text-anchor="middle" fill="#bb66ff" font-size="11" font-weight="500">veil::verifier (public(package))</text>
  <text x="610" y="656" text-anchor="middle" fill="#555" font-size="9">verify_transfer_proof | verify_compliance_proof | verify_withdraw_proof</text>
  <text x="610" y="670" text-anchor="middle" fill="#555" font-size="8">sui::groth16 BN254 native verifier</text>

  <line x1="610" y1="590" x2="610" y2="610" stroke="#bb66ff" stroke-width="1" marker-end="url(#arr-purple)"/>
  <text x="620" y="604" fill="#bb66ff" font-size="8">calls</text>

</svg>

<div class="legend">
  <div class="legend-item"><div class="legend-swatch" style="background:#0f1f15; border-color:#00cc66;"></div><span>Shared Object (Pool)</span></div>
  <div class="legend-item"><div class="legend-swatch" style="background:#1f0f0f; border-color:#ff4444;"></div><span>AdminCap (Owned)</span></div>
  <div class="legend-item"><div class="legend-swatch" style="background:#0f0f1f; border-color:#4488ff;"></div><span>Dynamic Fields</span></div>
  <div class="legend-item"><div class="legend-swatch" style="background:#0a1515; border-color:#00ff88;"></div><span>Entry Functions</span></div>
  <div class="legend-item"><div class="legend-swatch" style="background:#0f0f0f; border-color:#333;"></div><span>Internal Helpers</span></div>
  <div class="legend-item"><div class="legend-swatch" style="background:#0f0f0a; border-color:#ffcc00;"></div><span>Events</span></div>
</div>
</body>
</html>
