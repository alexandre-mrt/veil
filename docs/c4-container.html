<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veil — C4 Level 2: Container Diagram</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #e0e0e0;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 40px 20px;
  }
  h1 { font-size: 1.4rem; font-weight: 600; color: #00ff88; margin-bottom: 8px; letter-spacing: 0.05em; }
  .subtitle { font-size: 0.8rem; color: #666; margin-bottom: 40px; letter-spacing: 0.1em; text-transform: uppercase; }
  svg { max-width: 1200px; width: 100%; }
  .legend { margin-top: 32px; display: flex; gap: 32px; font-size: 0.75rem; color: #888; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 8px; }
  .legend-swatch { width: 16px; height: 16px; border-radius: 3px; border: 1px solid #333; }
</style>
</head>
<body>
<h1>Veil — Container Diagram</h1>
<p class="subtitle">C4 Level 2 &mdash; What runs inside the Veil system</p>

<svg viewBox="0 0 1200 1020" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00ff88"/>
    </marker>
    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4488ff"/>
    </marker>
    <marker id="arr-yellow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffcc00"/>
    </marker>
    <marker id="arr-purple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#bb66ff"/>
    </marker>
    <marker id="arr-cyan" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#44ccff"/>
    </marker>
    <marker id="arr-dim" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="1020" fill="url(#grid)"/>

  <!-- System boundary -->
  <rect x="30" y="20" width="1140" height="980" rx="8" fill="none" stroke="#1a3a25" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="60" y="50" fill="#1a3a25" font-size="12" font-weight="500">Veil Protocol — System Boundary</text>

  <!-- =============== CONTAINER: Sui Move Contracts =============== -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="520" height="380" rx="6" fill="#0f1f15" stroke="#00ff88" stroke-width="2"/>
    <text x="260" y="30" text-anchor="middle" fill="#00ff88" font-size="16" font-weight="700">Sui Move Contracts</text>
    <text x="260" y="48" text-anchor="middle" fill="#555" font-size="10">[Container: 4 Move modules]</text>

    <!-- pool.move -->
    <rect x="20" y="68" width="230" height="135" rx="4" fill="#0a150f" stroke="#00cc66" stroke-width="1"/>
    <text x="135" y="90" text-anchor="middle" fill="#00cc66" font-size="13" font-weight="600">pool.move</text>
    <text x="135" y="108" text-anchor="middle" fill="#999" font-size="9">Core protocol logic</text>
    <line x1="35" y1="115" x2="235" y2="115" stroke="#1a2a1f" stroke-width="0.5"/>
    <text x="135" y="130" text-anchor="middle" fill="#777" font-size="9">Shielded transfers (UTXO)</text>
    <text x="135" y="144" text-anchor="middle" fill="#777" font-size="9">zk_withdraw (ZK-proven)</text>
    <text x="135" y="158" text-anchor="middle" fill="#777" font-size="9">frozen_at_epoch (1-epoch delay)</text>
    <text x="135" y="172" text-anchor="middle" fill="#777" font-size="9">Configurable epoch_duration_ms</text>
    <text x="135" y="186" text-anchor="middle" fill="#777" font-size="9">Withdraw VK timelock</text>

    <!-- compliance.move -->
    <rect x="270" y="68" width="230" height="135" rx="4" fill="#0a150f" stroke="#00cc66" stroke-width="1"/>
    <text x="385" y="90" text-anchor="middle" fill="#00cc66" font-size="13" font-weight="600">compliance.move</text>
    <text x="385" y="108" text-anchor="middle" fill="#999" font-size="9">Tier 2/3 KYC enforcement</text>
    <line x1="285" y1="115" x2="485" y2="115" stroke="#1a2a1f" stroke-width="0.5"/>
    <text x="385" y="130" text-anchor="middle" fill="#777" font-size="9">compliant_transfer (ID validated)</text>
    <text x="385" y="144" text-anchor="middle" fill="#777" font-size="9">ComplianceConfig per pool</text>
    <text x="385" y="158" text-anchor="middle" fill="#777" font-size="9">Timelocked param updates</text>
    <text x="385" y="172" text-anchor="middle" fill="#777" font-size="9">CredentialNullifier tracking</text>
    <text x="385" y="186" text-anchor="middle" fill="#777" font-size="9">ECDH auditor encryption</text>

    <!-- verifier.move -->
    <rect x="20" y="218" width="230" height="135" rx="4" fill="#0a150f" stroke="#00cc66" stroke-width="1"/>
    <text x="135" y="240" text-anchor="middle" fill="#00cc66" font-size="13" font-weight="600">verifier.move</text>
    <text x="135" y="258" text-anchor="middle" fill="#999" font-size="9">Proof verification wrapper</text>
    <line x1="35" y1="265" x2="235" y2="265" stroke="#1a2a1f" stroke-width="0.5"/>
    <text x="135" y="280" text-anchor="middle" fill="#777" font-size="9">verify_transfer_proof()</text>
    <text x="135" y="294" text-anchor="middle" fill="#777" font-size="9">verify_compliance_proof()</text>
    <text x="135" y="308" text-anchor="middle" fill="#777" font-size="9">verify_withdraw_proof()</text>
    <text x="135" y="322" text-anchor="middle" fill="#777" font-size="9">sui::groth16 BN254 native</text>
    <text x="135" y="336" text-anchor="middle" fill="#777" font-size="9">public(package) access only</text>

    <!-- token.move -->
    <rect x="270" y="218" width="230" height="135" rx="4" fill="#0a150f" stroke="#00cc66" stroke-width="1"/>
    <text x="385" y="240" text-anchor="middle" fill="#00cc66" font-size="13" font-weight="600">token.move</text>
    <text x="385" y="258" text-anchor="middle" fill="#999" font-size="9">VEIL test token</text>
    <line x1="285" y1="265" x2="485" y2="265" stroke="#1a2a1f" stroke-width="0.5"/>
    <text x="385" y="280" text-anchor="middle" fill="#777" font-size="9">TreasuryCap minting</text>
    <text x="385" y="294" text-anchor="middle" fill="#777" font-size="9">Faucet (testnet only)</text>
    <text x="385" y="308" text-anchor="middle" fill="#777" font-size="9">6 decimals</text>
  </g>

  <!-- =============== CONTAINER: Circuits =============== -->
  <g transform="translate(630, 80)">
    <rect x="0" y="0" width="500" height="260" rx="6" fill="#1f0f1f" stroke="#bb66ff" stroke-width="2"/>
    <text x="250" y="30" text-anchor="middle" fill="#bb66ff" font-size="16" font-weight="700">ZK Circuits</text>
    <text x="250" y="48" text-anchor="middle" fill="#555" font-size="10">[Container: 3 Circom circuits — BN254 Groth16]</text>
    <line x1="20" y1="58" x2="480" y2="58" stroke="#2a1a2a" stroke-width="0.5"/>

    <!-- Transfer circuit -->
    <rect x="20" y="72" width="460" height="44" rx="3" fill="#1a0f1a" stroke="#bb66ff" stroke-width="0.8"/>
    <text x="30" y="90" fill="#bb66ff" font-size="12" font-weight="600">transfer.circom</text>
    <text x="250" y="90" fill="#999" font-size="10">13,611 R1CS constraints</text>
    <text x="30" y="106" fill="#777" font-size="9">Poseidon(4) commitments, note-based nullifiers, domain tags 1-3</text>

    <!-- Compliance circuit -->
    <rect x="20" y="126" width="460" height="44" rx="3" fill="#1a0f1a" stroke="#bb66ff" stroke-width="0.8"/>
    <text x="30" y="144" fill="#bb66ff" font-size="12" font-weight="600">compliance.circom</text>
    <text x="250" y="144" fill="#999" font-size="10">12,743 R1CS constraints (Merkle depth 20)</text>
    <text x="30" y="160" fill="#777" font-size="9">Context-bound credential nullifiers, domain tags 4-6</text>

    <!-- Withdraw circuit -->
    <rect x="20" y="180" width="460" height="44" rx="3" fill="#1a0f1a" stroke="#bb66ff" stroke-width="0.8"/>
    <text x="30" y="198" fill="#bb66ff" font-size="12" font-weight="600">withdraw.circom</text>
    <text x="250" y="198" fill="#999" font-size="10">8 constraints, domain tags 7-8</text>
    <text x="30" y="214" fill="#777" font-size="9">Recipient binding, amount &lt;= cumulative, ZK-proven exit</text>

    <!-- MPC ceremony note -->
    <text x="250" y="246" text-anchor="middle" fill="#666" font-size="9">MPC trusted setup: 3 contributors, transfer + withdraw circuits</text>
  </g>

  <!-- =============== CONTAINER: Frontend =============== -->
  <g transform="translate(60, 510)">
    <rect x="0" y="0" width="520" height="200" rx="6" fill="#1f1a0f" stroke="#ffcc00" stroke-width="2"/>
    <text x="260" y="30" text-anchor="middle" fill="#ffcc00" font-size="16" font-weight="700">Frontend</text>
    <text x="260" y="48" text-anchor="middle" fill="#555" font-size="10">[Container: Next.js 14 + @mysten/dapp-kit v2]</text>
    <line x1="20" y1="58" x2="500" y2="58" stroke="#2a2a1a" stroke-width="0.5"/>

    <text x="30" y="80" fill="#ccc" font-size="10">Wallet connection</text>
    <text x="30" y="96" fill="#888" font-size="9">@mysten/dapp-kit v2 — ConnectButton, SignAndExecuteTransaction</text>

    <text x="30" y="118" fill="#ccc" font-size="10">Client-side proving</text>
    <text x="30" y="134" fill="#888" font-size="9">snarkjs WASM in Web Worker — ~2s per proof</text>

    <text x="30" y="156" fill="#ccc" font-size="10">Private state management</text>
    <text x="30" y="172" fill="#888" font-size="9">AES-GCM encrypted localStorage: userSecret, cumulative, randomness</text>

    <text x="30" y="192" fill="#ccc" font-size="10">Security</text>
    <text x="170" y="192" fill="#888" font-size="9">CSP headers, mock proof gate for testing</text>
  </g>

  <!-- =============== CONTAINER: Relayer =============== -->
  <g transform="translate(630, 390)">
    <rect x="0" y="0" width="240" height="150" rx="6" fill="#0f1a1f" stroke="#44ccff" stroke-width="2"/>
    <text x="120" y="28" text-anchor="middle" fill="#44ccff" font-size="14" font-weight="700">Relayer</text>
    <text x="120" y="46" text-anchor="middle" fill="#555" font-size="10">[Container: Bun server]</text>
    <line x1="15" y1="56" x2="225" y2="56" stroke="#1a2a2f" stroke-width="0.5"/>
    <text x="120" y="76" text-anchor="middle" fill="#ccc" font-size="10">Sponsored transactions</text>
    <text x="120" y="96" text-anchor="middle" fill="#888" font-size="9">CORS restricted origin</text>
    <text x="120" y="112" text-anchor="middle" fill="#888" font-size="9">Rate limiting per IP</text>
    <text x="120" y="128" text-anchor="middle" fill="#888" font-size="9">Error sanitization</text>
    <text x="120" y="142" text-anchor="middle" fill="#888" font-size="9">Hides sender address</text>
  </g>

  <!-- =============== CONTAINER: E2E Pipeline =============== -->
  <g transform="translate(910, 390)">
    <rect x="0" y="0" width="230" height="150" rx="6" fill="#0f1a0f" stroke="#66cc66" stroke-width="2"/>
    <text x="115" y="28" text-anchor="middle" fill="#66cc66" font-size="14" font-weight="700">E2E Pipeline</text>
    <text x="115" y="46" text-anchor="middle" fill="#555" font-size="10">[Container: TypeScript / Bun]</text>
    <line x1="15" y1="56" x2="215" y2="56" stroke="#1a2a1a" stroke-width="0.5"/>
    <text x="115" y="76" text-anchor="middle" fill="#ccc" font-size="10">e2e-test.ts</text>
    <text x="115" y="96" text-anchor="middle" fill="#888" font-size="9">Deploy contracts</text>
    <text x="115" y="112" text-anchor="middle" fill="#888" font-size="9">Mint, deposit, prove</text>
    <text x="115" y="128" text-anchor="middle" fill="#888" font-size="9">Withdraw circuit tests</text>
    <text x="115" y="142" text-anchor="middle" fill="#888" font-size="9">Testnet verification</text>
  </g>

  <!-- =============== EXTERNAL: Sui Blockchain =============== -->
  <g transform="translate(60, 760)">
    <rect x="0" y="0" width="1080" height="140" rx="6" fill="#0f0f1f" stroke="#4488ff" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="540" y="28" text-anchor="middle" fill="#4488ff" font-size="14" font-weight="600">Sui Testnet</text>
    <text x="540" y="46" text-anchor="middle" fill="#555" font-size="10">[External: L1 — testnet/mainnet]</text>
    <line x1="20" y1="56" x2="1060" y2="56" stroke="#1a1a3a" stroke-width="0.5"/>

    <!-- On-chain objects -->
    <text x="30" y="78" fill="#ccc" font-size="10" font-weight="500">Shared Objects:</text>
    <text x="30" y="96" fill="#888" font-size="9">Pool (balance, VKs, epoch_duration_ms, frozen_at_epoch, compliance_config)</text>

    <text x="30" y="116" fill="#ccc" font-size="10" font-weight="500">Owned Objects:</text>
    <text x="30" y="132" fill="#888" font-size="9">AdminCap (key only, no store), ComplianceConfig, TreasuryCap, UpgradeCap</text>

    <text x="600" y="78" fill="#ccc" font-size="10" font-weight="500">Dynamic Fields:</text>
    <text x="600" y="96" fill="#888" font-size="9">NullifierKey, CommitmentKey, CredentialNullifierKey</text>

    <text x="600" y="116" fill="#ccc" font-size="10" font-weight="500">Native:</text>
    <text x="600" y="132" fill="#888" font-size="9">Groth16 BN254 verifier (sui::groth16), Clock object</text>
  </g>

  <!-- =============== ARROWS =============== -->

  <!-- Frontend -> Contracts: signed tx -->
  <line x1="320" y1="510" x2="320" y2="465" stroke="#ffcc00" stroke-width="1.2" marker-end="url(#arr-yellow)"/>
  <text x="330" y="492" fill="#ffcc00" font-size="8">PTB calls</text>

  <!-- Frontend -> Relayer -->
  <line x1="580" y1="600" x2="630" y2="500" stroke="#44ccff" stroke-width="1.2" marker-end="url(#arr-cyan)"/>
  <text x="590" y="545" fill="#44ccff" font-size="8" transform="rotate(-60, 590, 545)">relay sponsored tx</text>

  <!-- Contracts -> Sui -->
  <line x1="320" y1="460" x2="320" y2="760" stroke="#4488ff" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <text x="330" y="620" fill="#4488ff" font-size="8">on-chain execution</text>

  <!-- Circuits -> Contracts (VK) -->
  <line x1="630" y1="240" x2="460" y2="240" stroke="#bb66ff" stroke-width="1.2" marker-end="url(#arr-purple)"/>
  <text x="545" y="233" fill="#bb66ff" font-size="8" text-anchor="middle">3 compiled VKs stored on-chain</text>

  <!-- Circuits -> Frontend (WASM) -->
  <line x1="750" y1="340" x2="520" y2="510" stroke="#ffcc00" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-yellow)"/>
  <text x="660" y="410" fill="#ffcc00" font-size="8" transform="rotate(45, 660, 410)">WASM + zkey</text>

  <!-- E2E -> Contracts -->
  <line x1="910" y1="465" x2="580" y2="340" stroke="#66cc66" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="760" y="390" fill="#66cc66" font-size="8" transform="rotate(18, 760, 390)">deploy + test</text>

  <!-- E2E -> Sui -->
  <line x1="1025" y1="540" x2="1025" y2="760" stroke="#4488ff" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <text x="1035" y="660" fill="#4488ff" font-size="8">testnet RPC</text>

  <!-- Relayer -> Sui -->
  <line x1="750" y1="540" x2="750" y2="760" stroke="#4488ff" stroke-width="1" marker-end="url(#arr-blue)"/>
  <text x="760" y="660" fill="#4488ff" font-size="8">sponsored tx</text>

</svg>

<div class="legend">
  <div class="legend-item"><div class="legend-swatch" style="background:#0f1f15; border-color:#00ff88;"></div><span>Move Contracts (4 modules)</span></div>
  <div class="legend-item"><div class="legend-swatch" style="background:#1f0f1f; border-color:#bb66ff;"></div><span>ZK Circuits (3)</span></div>
  <div class="legend-item"><div class="legend-swatch" style="background:#1f1a0f; border-color:#ffcc00;"></div><span>Frontend</span></div>
  <div class="legend-item"><div class="legend-swatch" style="background:#0f1a1f; border-color:#44ccff;"></div><span>Relayer</span></div>
  <div class="legend-item"><div class="legend-swatch" style="background:#0f1a0f; border-color:#66cc66;"></div><span>E2E Pipeline</span></div>
  <div class="legend-item"><div class="legend-swatch" style="background:#0f0f1f; border-color:#4488ff;"></div><span>Sui Blockchain (external)</span></div>
</div>
</body>
</html>
