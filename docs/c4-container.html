<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veil — C4 Level 2: Container Diagram</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #e0e0e0;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 40px 20px;
  }
  h1 { font-size: 1.4rem; font-weight: 600; color: #00ff88; margin-bottom: 8px; letter-spacing: 0.05em; }
  .subtitle { font-size: 0.8rem; color: #666; margin-bottom: 40px; letter-spacing: 0.1em; text-transform: uppercase; }
  svg { max-width: 1200px; width: 100%; }
  .legend { margin-top: 32px; display: flex; gap: 32px; font-size: 0.75rem; color: #888; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 8px; }
  .legend-swatch { width: 16px; height: 16px; border-radius: 3px; border: 1px solid #333; }
</style>
</head>
<body>
<h1>Veil — Container Diagram</h1>
<p class="subtitle">C4 Level 2 &mdash; What runs inside the Veil system</p>

<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00ff88"/>
    </marker>
    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4488ff"/>
    </marker>
    <marker id="arr-yellow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffcc00"/>
    </marker>
    <marker id="arr-purple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#bb66ff"/>
    </marker>
    <marker id="arr-dim" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#grid)"/>

  <!-- System boundary -->
  <rect x="30" y="20" width="1140" height="860" rx="8" fill="none" stroke="#1a3a25" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="60" y="50" fill="#1a3a25" font-size="12" font-weight="500">Veil Protocol — System Boundary</text>

  <!-- ═══════════════ CONTAINER: Sui Move Contracts ═══════════════ -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="520" height="340" rx="6" fill="#0f1f15" stroke="#00ff88" stroke-width="2"/>
    <text x="260" y="30" text-anchor="middle" fill="#00ff88" font-size="16" font-weight="700">Sui Move Contracts</text>
    <text x="260" y="48" text-anchor="middle" fill="#555" font-size="10">[Container: Sui Move packages]</text>

    <!-- pool.move -->
    <rect x="20" y="68" width="225" height="120" rx="4" fill="#0a150f" stroke="#00cc66" stroke-width="1"/>
    <text x="132" y="90" text-anchor="middle" fill="#00cc66" font-size="13" font-weight="600">pool.move</text>
    <text x="132" y="108" text-anchor="middle" fill="#999" font-size="9">Core protocol logic</text>
    <line x1="35" y1="115" x2="230" y2="115" stroke="#1a2a1f" stroke-width="0.5"/>
    <text x="132" y="130" text-anchor="middle" fill="#777" font-size="9">Shielded transfers (UTXO)</text>
    <text x="132" y="144" text-anchor="middle" fill="#777" font-size="9">Nullifier tracking</text>
    <text x="132" y="158" text-anchor="middle" fill="#777" font-size="9">Commitment store</text>
    <text x="132" y="172" text-anchor="middle" fill="#777" font-size="9">Epoch management</text>

    <!-- verifier.move -->
    <rect x="265" y="68" width="235" height="120" rx="4" fill="#0a150f" stroke="#00cc66" stroke-width="1"/>
    <text x="382" y="90" text-anchor="middle" fill="#00cc66" font-size="13" font-weight="600">verifier.move</text>
    <text x="382" y="108" text-anchor="middle" fill="#999" font-size="9">Proof verification wrapper</text>
    <line x1="280" y1="115" x2="485" y2="115" stroke="#1a2a1f" stroke-width="0.5"/>
    <text x="382" y="130" text-anchor="middle" fill="#777" font-size="9">sui::groth16 BN254</text>
    <text x="382" y="144" text-anchor="middle" fill="#777" font-size="9">prepare_verifying_key()</text>
    <text x="382" y="158" text-anchor="middle" fill="#777" font-size="9">verify_groth16_proof()</text>
    <text x="382" y="172" text-anchor="middle" fill="#777" font-size="9">public(package) access</text>

    <!-- token.move -->
    <rect x="20" y="205" width="225" height="110" rx="4" fill="#0a150f" stroke="#00cc66" stroke-width="1"/>
    <text x="132" y="227" text-anchor="middle" fill="#00cc66" font-size="13" font-weight="600">token.move</text>
    <text x="132" y="245" text-anchor="middle" fill="#999" font-size="9">VEIL test token</text>
    <line x1="35" y1="252" x2="230" y2="252" stroke="#1a2a1f" stroke-width="0.5"/>
    <text x="132" y="268" text-anchor="middle" fill="#777" font-size="9">TreasuryCap minting</text>
    <text x="132" y="282" text-anchor="middle" fill="#777" font-size="9">Faucet (1000 VEIL)</text>
    <text x="132" y="296" text-anchor="middle" fill="#777" font-size="9">6 decimals</text>

    <!-- Shared state -->
    <rect x="265" y="205" width="235" height="110" rx="4" fill="#0a0a15" stroke="#4466aa" stroke-width="1"/>
    <text x="382" y="227" text-anchor="middle" fill="#4466aa" font-size="13" font-weight="600">Shared State</text>
    <text x="382" y="245" text-anchor="middle" fill="#999" font-size="9">On-chain objects</text>
    <line x1="280" y1="252" x2="485" y2="252" stroke="#1a1a2f" stroke-width="0.5"/>
    <text x="382" y="268" text-anchor="middle" fill="#777" font-size="9">Pool (shared object)</text>
    <text x="382" y="282" text-anchor="middle" fill="#777" font-size="9">AdminCap (owned object)</text>
    <text x="382" y="296" text-anchor="middle" fill="#777" font-size="9">Dynamic fields (nullifiers)</text>
  </g>

  <!-- ═══════════════ CONTAINER: Circom Circuit ═══════════════ -->
  <g transform="translate(630, 80)">
    <rect x="0" y="0" width="500" height="180" rx="6" fill="#1f0f1f" stroke="#bb66ff" stroke-width="2"/>
    <text x="250" y="30" text-anchor="middle" fill="#bb66ff" font-size="16" font-weight="700">Circom Circuit</text>
    <text x="250" y="48" text-anchor="middle" fill="#555" font-size="10">[Container: transfer.circom — BN254 Groth16]</text>
    <line x1="20" y1="58" x2="480" y2="58" stroke="#2a1a2a" stroke-width="0.5"/>
    <text x="250" y="80" text-anchor="middle" fill="#ccc" font-size="11">11 constraints, ~1,250 R1CS</text>
    <text x="250" y="100" text-anchor="middle" fill="#999" font-size="10">Poseidon(4) commitments bound to userSecret</text>
    <text x="250" y="118" text-anchor="middle" fill="#999" font-size="10">Note-based nullifiers (multiple txs/epoch)</text>
    <text x="250" y="136" text-anchor="middle" fill="#999" font-size="10">64-bit range proofs + threshold enforcement</text>
    <text x="250" y="154" text-anchor="middle" fill="#999" font-size="10">Domain-separated: tag 1 (commit), tag 2 (null), tag 3 (hash)</text>
  </g>

  <!-- ═══════════════ CONTAINER: Frontend ═══════════════ -->
  <g transform="translate(60, 470)">
    <rect x="0" y="0" width="520" height="190" rx="6" fill="#1f1a0f" stroke="#ffcc00" stroke-width="2"/>
    <text x="260" y="30" text-anchor="middle" fill="#ffcc00" font-size="16" font-weight="700">Frontend</text>
    <text x="260" y="48" text-anchor="middle" fill="#555" font-size="10">[Container: Next.js 14 + @mysten/dapp-kit]</text>
    <line x1="20" y1="58" x2="500" y2="58" stroke="#2a2a1a" stroke-width="0.5"/>

    <text x="30" y="80" fill="#ccc" font-size="10">Wallet connection</text>
    <text x="30" y="96" fill="#888" font-size="9">@mysten/dapp-kit — ConnectButton, SignAndExecuteTransaction</text>

    <text x="30" y="118" fill="#ccc" font-size="10">Client-side proving</text>
    <text x="30" y="134" fill="#888" font-size="9">snarkjs WASM in Web Worker — ~2s per proof</text>

    <text x="30" y="156" fill="#ccc" font-size="10">Private state management</text>
    <text x="30" y="172" fill="#888" font-size="9">Encrypted localStorage: userSecret, cumulative, randomness</text>
  </g>

  <!-- ═══════════════ CONTAINER: Proof Converter ═══════════════ -->
  <g transform="translate(630, 310)">
    <rect x="0" y="0" width="240" height="140" rx="6" fill="#0f1a1f" stroke="#44ccff" stroke-width="2"/>
    <text x="120" y="28" text-anchor="middle" fill="#44ccff" font-size="14" font-weight="700">Proof Converter</text>
    <text x="120" y="46" text-anchor="middle" fill="#555" font-size="10">[Container: TypeScript]</text>
    <line x1="15" y1="56" x2="225" y2="56" stroke="#1a2a2f" stroke-width="0.5"/>
    <text x="120" y="76" text-anchor="middle" fill="#ccc" font-size="10">proof-converter.ts</text>
    <text x="120" y="96" text-anchor="middle" fill="#888" font-size="9">snarkjs JSON -> Sui bytes</text>
    <text x="120" y="112" text-anchor="middle" fill="#888" font-size="9">G2 point compression</text>
    <text x="120" y="128" text-anchor="middle" fill="#888" font-size="9">Sign bit computation</text>
  </g>

  <!-- ═══════════════ CONTAINER: E2E Pipeline ═══════════════ -->
  <g transform="translate(910, 310)">
    <rect x="0" y="0" width="230" height="140" rx="6" fill="#0f1a0f" stroke="#66cc66" stroke-width="2"/>
    <text x="115" y="28" text-anchor="middle" fill="#66cc66" font-size="14" font-weight="700">E2E Pipeline</text>
    <text x="115" y="46" text-anchor="middle" fill="#555" font-size="10">[Container: TypeScript / Bun]</text>
    <line x1="15" y1="56" x2="215" y2="56" stroke="#1a2a1a" stroke-width="0.5"/>
    <text x="115" y="76" text-anchor="middle" fill="#ccc" font-size="10">e2e-test.ts</text>
    <text x="115" y="96" text-anchor="middle" fill="#888" font-size="9">Deploy contracts</text>
    <text x="115" y="112" text-anchor="middle" fill="#888" font-size="9">Mint, deposit, prove</text>
    <text x="115" y="128" text-anchor="middle" fill="#888" font-size="9">Testnet verification</text>
  </g>

  <!-- ═══════════════ EXTERNAL: Sui Blockchain ═══════════════ -->
  <g transform="translate(630, 500)">
    <rect x="0" y="0" width="500" height="120" rx="6" fill="#0f0f1f" stroke="#4488ff" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="250" y="28" text-anchor="middle" fill="#4488ff" font-size="14" font-weight="600">Sui Blockchain</text>
    <text x="250" y="46" text-anchor="middle" fill="#555" font-size="10">[External: L1 — testnet/mainnet]</text>
    <line x1="20" y1="56" x2="480" y2="56" stroke="#1a1a3a" stroke-width="0.5"/>
    <text x="250" y="76" text-anchor="middle" fill="#888" font-size="10">Native Groth16 BN254 verifier (sui::groth16)</text>
    <text x="250" y="94" text-anchor="middle" fill="#888" font-size="10">Clock object &mdash; epoch_id = timestamp_ms / 2,592,000,000</text>
    <text x="250" y="112" text-anchor="middle" fill="#888" font-size="10">Dynamic fields for nullifiers &amp; commitments</text>
  </g>

  <!-- ═══════════════ ARROWS ═══════════════ -->

  <!-- Frontend -> Contracts: signed tx -->
  <line x1="320" y1="470" x2="320" y2="425" stroke="#ffcc00" stroke-width="1.2" marker-end="url(#arr-yellow)"/>
  <text x="330" y="450" fill="#ffcc00" font-size="8">PTB calls</text>

  <!-- Frontend -> Proof Converter -->
  <line x1="580" y1="540" x2="630" y2="420" stroke="#44ccff" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="590" y="475" fill="#44ccff" font-size="8" transform="rotate(-60, 590, 475)">convert proof</text>

  <!-- Contracts -> Sui -->
  <line x1="460" y1="420" x2="700" y2="500" stroke="#4488ff" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <text x="560" y="450" fill="#4488ff" font-size="8" transform="rotate(18, 560, 450)">on-chain execution</text>

  <!-- Circuit -> Contracts (VK) -->
  <line x1="630" y1="200" x2="460" y2="200" stroke="#bb66ff" stroke-width="1.2" marker-end="url(#arr-purple)"/>
  <text x="545" y="193" fill="#bb66ff" font-size="8" text-anchor="middle">compiled VK stored on-chain</text>

  <!-- Circuit -> Frontend (WASM) -->
  <line x1="750" y1="260" x2="520" y2="470" stroke="#ffcc00" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-yellow)"/>
  <text x="660" y="350" fill="#ffcc00" font-size="8" transform="rotate(45, 660, 350)">WASM + zkey</text>

  <!-- E2E -> Contracts -->
  <line x1="910" y1="380" x2="580" y2="300" stroke="#66cc66" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="760" y="330" fill="#66cc66" font-size="8" transform="rotate(18, 760, 330)">deploy + test</text>

  <!-- E2E -> Sui -->
  <line x1="1025" y1="450" x2="1000" y2="500" stroke="#4488ff" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <text x="1030" y="478" fill="#4488ff" font-size="8">testnet RPC</text>

  <!-- Proof Converter -> Contracts -->
  <line x1="630" y1="350" x2="580" y2="320" stroke="#00ff88" stroke-width="1" marker-end="url(#arr)"/>
  <text x="590" y="328" fill="#00ff88" font-size="8">Sui bytes</text>

</svg>

<div class="legend">
  <div class="legend-item"><div class="legend-swatch" style="background:#0f1f15; border-color:#00ff88;"></div><span>Move Contracts</span></div>
  <div class="legend-item"><div class="legend-swatch" style="background:#1f0f1f; border-color:#bb66ff;"></div><span>ZK Circuit</span></div>
  <div class="legend-item"><div class="legend-swatch" style="background:#1f1a0f; border-color:#ffcc00;"></div><span>Frontend</span></div>
  <div class="legend-item"><div class="legend-swatch" style="background:#0f1a1f; border-color:#44ccff;"></div><span>Proof Converter</span></div>
  <div class="legend-item"><div class="legend-swatch" style="background:#0f1a0f; border-color:#66cc66;"></div><span>E2E Pipeline</span></div>
  <div class="legend-item"><div class="legend-swatch" style="background:#0f0f1f; border-color:#4488ff;"></div><span>Sui Blockchain (external)</span></div>
</div>
</body>
</html>
