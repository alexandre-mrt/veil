<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veil — ZK Circuit Constraint Flow</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #e0e0e0;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 40px 20px;
  }
  h1 { font-size: 1.4rem; font-weight: 600; color: #00ff88; margin-bottom: 8px; letter-spacing: 0.05em; }
  .subtitle { font-size: 0.8rem; color: #666; margin-bottom: 40px; letter-spacing: 0.1em; text-transform: uppercase; }
  svg { max-width: 1300px; width: 100%; }
  .legend { margin-top: 32px; display: flex; gap: 32px; font-size: 0.75rem; color: #888; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 8px; }
  .legend-swatch { width: 16px; height: 16px; border-radius: 3px; border: 1px solid #333; }
</style>
</head>
<body>
<h1>Veil — ZK Circuit Constraint Flow</h1>
<p class="subtitle">3 circuits: transfer (13,611 R1CS) + compliance (12,743) + withdraw (3,058) &mdash; BN254 Groth16, 8 domain tags</p>

<svg viewBox="0 0 1300 1150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00ff88"/>
    </marker>
    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4488ff"/>
    </marker>
    <marker id="arr-purple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#bb66ff"/>
    </marker>
    <marker id="arr-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff9900"/>
    </marker>
    <marker id="arr-cyan" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#44ccff"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="1300" height="1150" fill="url(#grid)"/>

  <!-- ═══════════════ INPUT COLUMNS ═══════════════ -->

  <!-- Private Inputs header -->
  <rect x="40" y="30" width="300" height="36" rx="4" fill="#1a0f0f" stroke="#ff6666" stroke-width="1"/>
  <text x="190" y="54" text-anchor="middle" fill="#ff6666" font-size="13" font-weight="700">PRIVATE INPUTS (7)</text>
  <text x="190" y="70" text-anchor="middle" fill="#555" font-size="9">Never leave the browser</text>

  <!-- Private input boxes -->
  <g>
    <rect x="40" y="90" width="300" height="30" rx="3" fill="#150f0f" stroke="#ff4444" stroke-width="0.8"/>
    <text x="190" y="110" text-anchor="middle" fill="#ff6666" font-size="11">cumulativeOld</text>

    <rect x="40" y="130" width="300" height="30" rx="3" fill="#150f0f" stroke="#ff4444" stroke-width="0.8"/>
    <text x="190" y="150" text-anchor="middle" fill="#ff6666" font-size="11">cumulativeNew</text>

    <rect x="40" y="170" width="300" height="30" rx="3" fill="#150f0f" stroke="#ff4444" stroke-width="0.8"/>
    <text x="190" y="190" text-anchor="middle" fill="#ff6666" font-size="11">txAmount</text>

    <rect x="40" y="210" width="300" height="30" rx="3" fill="#150f0f" stroke="#ff4444" stroke-width="0.8"/>
    <text x="190" y="230" text-anchor="middle" fill="#ff6666" font-size="11">randomnessOld</text>

    <rect x="40" y="250" width="300" height="30" rx="3" fill="#150f0f" stroke="#ff4444" stroke-width="0.8"/>
    <text x="190" y="270" text-anchor="middle" fill="#ff6666" font-size="11">randomnessNew</text>

    <rect x="40" y="290" width="300" height="30" rx="3" fill="#150f0f" stroke="#ff4444" stroke-width="0.8"/>
    <text x="190" y="310" text-anchor="middle" fill="#ff6666" font-size="11">userSecret</text>

    <rect x="40" y="330" width="300" height="30" rx="3" fill="#150f0f" stroke="#ff4444" stroke-width="0.8"/>
    <text x="190" y="350" text-anchor="middle" fill="#ff6666" font-size="11">salt</text>
  </g>

  <!-- Public Inputs header -->
  <rect x="960" y="30" width="300" height="36" rx="4" fill="#0f0f1a" stroke="#4488ff" stroke-width="1"/>
  <text x="1110" y="54" text-anchor="middle" fill="#4488ff" font-size="13" font-weight="700">PUBLIC INPUTS (6)</text>
  <text x="1110" y="70" text-anchor="middle" fill="#555" font-size="9">Sent to Sui contract</text>

  <!-- Public input boxes -->
  <g>
    <rect x="960" y="90" width="300" height="30" rx="3" fill="#0f0f15" stroke="#4488ff" stroke-width="0.8"/>
    <text x="1110" y="110" text-anchor="middle" fill="#6699ff" font-size="11">oldCommitment [0..32]</text>

    <rect x="960" y="130" width="300" height="30" rx="3" fill="#0f0f15" stroke="#4488ff" stroke-width="0.8"/>
    <text x="1110" y="150" text-anchor="middle" fill="#6699ff" font-size="11">newCommitment [32..64]</text>

    <rect x="960" y="170" width="300" height="30" rx="3" fill="#0f0f15" stroke="#4488ff" stroke-width="0.8"/>
    <text x="1110" y="190" text-anchor="middle" fill="#6699ff" font-size="11">threshold [64..96]</text>

    <rect x="960" y="210" width="300" height="30" rx="3" fill="#0f0f15" stroke="#4488ff" stroke-width="0.8"/>
    <text x="1110" y="230" text-anchor="middle" fill="#6699ff" font-size="11">epochId [96..128]</text>

    <rect x="960" y="250" width="300" height="30" rx="3" fill="#0f0f15" stroke="#4488ff" stroke-width="0.8"/>
    <text x="1110" y="270" text-anchor="middle" fill="#6699ff" font-size="11">nullifier [128..160]</text>

    <rect x="960" y="290" width="300" height="30" rx="3" fill="#0f0f15" stroke="#4488ff" stroke-width="0.8"/>
    <text x="1110" y="310" text-anchor="middle" fill="#6699ff" font-size="11">txAmountHash [160..192]</text>
  </g>

  <!-- ═══════════════ CONSTRAINT BLOCKS ═══════════════ -->

  <!-- Section: Commitment Integrity (C1, C2) -->
  <rect x="390" y="80" width="520" height="200" rx="6" fill="#0a150f" stroke="#00cc66" stroke-width="1.5"/>
  <text x="650" y="104" text-anchor="middle" fill="#00cc66" font-size="13" font-weight="700">COMMITMENT INTEGRITY</text>

  <!-- C1 -->
  <rect x="410" y="116" width="480" height="66" rx="4" fill="#0f1a12" stroke="#00ff88" stroke-width="1"/>
  <text x="420" y="136" fill="#00ff88" font-size="12" font-weight="700">C1</text>
  <text x="455" y="136" fill="#ccc" font-size="11">Old commitment well-formed</text>
  <rect x="420" y="146" width="460" height="28" rx="3" fill="#0a0f0a" stroke="#1a2a1f" stroke-width="0.5"/>
  <text x="650" y="165" text-anchor="middle" fill="#00ff88" font-size="11">Poseidon(1, cumOld, randOld, userSecret) === oldCommitment</text>

  <!-- C2 -->
  <rect x="410" y="194" width="480" height="66" rx="4" fill="#0f1a12" stroke="#00ff88" stroke-width="1"/>
  <text x="420" y="214" fill="#00ff88" font-size="12" font-weight="700">C2</text>
  <text x="455" y="214" fill="#ccc" font-size="11">New commitment well-formed</text>
  <rect x="420" y="224" width="460" height="28" rx="3" fill="#0a0f0a" stroke="#1a2a1f" stroke-width="0.5"/>
  <text x="650" y="243" text-anchor="middle" fill="#00ff88" font-size="11">Poseidon(1, cumNew, randNew, userSecret) === newCommitment</text>

  <!-- Section: Arithmetic (C3, C4) -->
  <rect x="390" y="300" width="520" height="130" rx="6" fill="#0f0f15" stroke="#bb66ff" stroke-width="1.5"/>
  <text x="650" y="324" text-anchor="middle" fill="#bb66ff" font-size="13" font-weight="700">ARITHMETIC CORRECTNESS</text>

  <!-- C3 -->
  <rect x="410" y="336" width="480" height="34" rx="4" fill="#0f0a15" stroke="#bb66ff" stroke-width="1"/>
  <text x="420" y="358" fill="#bb66ff" font-size="12" font-weight="700">C3</text>
  <text x="455" y="358" fill="#ccc" font-size="11">cumNew === cumOld + txAmount</text>

  <!-- C4 -->
  <rect x="410" y="380" width="480" height="34" rx="4" fill="#0f0a15" stroke="#bb66ff" stroke-width="1"/>
  <text x="420" y="402" fill="#bb66ff" font-size="12" font-weight="700">C4</text>
  <text x="455" y="402" fill="#ccc" font-size="11">txAmount > 0</text>
  <text x="830" y="402" fill="#666" font-size="9" text-anchor="end">GreaterThan(64)</text>

  <!-- Section: Range Proofs (C5, C6, C7, C8) -->
  <rect x="390" y="450" width="520" height="200" rx="6" fill="#15100a" stroke="#ff9900" stroke-width="1.5"/>
  <text x="650" y="474" text-anchor="middle" fill="#ff9900" font-size="13" font-weight="700">RANGE PROOFS — 64-bit overflow prevention</text>

  <!-- C5 -->
  <rect x="410" y="486" width="480" height="34" rx="4" fill="#150f0a" stroke="#ff9900" stroke-width="1"/>
  <text x="420" y="508" fill="#ff9900" font-size="12" font-weight="700">C5</text>
  <text x="455" y="508" fill="#ccc" font-size="11">cumulativeOld fits in 64 bits</text>
  <text x="830" y="508" fill="#666" font-size="9" text-anchor="end">Num2Bits(64)</text>

  <!-- C6 -->
  <rect x="410" y="528" width="480" height="34" rx="4" fill="#150f0a" stroke="#ff9900" stroke-width="1"/>
  <text x="420" y="550" fill="#ff9900" font-size="12" font-weight="700">C6</text>
  <text x="455" y="550" fill="#ccc" font-size="11">txAmount fits in 64 bits</text>
  <text x="830" y="550" fill="#666" font-size="9" text-anchor="end">Num2Bits(64)</text>

  <!-- C7 -->
  <rect x="410" y="570" width="480" height="34" rx="4" fill="#150f0a" stroke="#ff9900" stroke-width="1"/>
  <text x="420" y="592" fill="#ff9900" font-size="12" font-weight="700">C7</text>
  <text x="455" y="592" fill="#ccc" font-size="11">cumulativeNew fits in 64 bits</text>
  <text x="830" y="592" fill="#666" font-size="9" text-anchor="end">Num2Bits(64)</text>

  <!-- C8 -->
  <rect x="410" y="612" width="480" height="34" rx="4" fill="#150f0a" stroke="#ff9900" stroke-width="1"/>
  <text x="420" y="634" fill="#ff9900" font-size="12" font-weight="700">C8</text>
  <text x="455" y="634" fill="#ccc" font-size="11">threshold fits in 64 bits</text>
  <text x="830" y="634" fill="#666" font-size="9" text-anchor="end">Num2Bits(64)</text>

  <!-- Section: Threshold (C9) -->
  <rect x="390" y="670" width="520" height="66" rx="6" fill="#15150a" stroke="#ffcc00" stroke-width="1.5"/>
  <text x="650" y="694" text-anchor="middle" fill="#ffcc00" font-size="13" font-weight="700">THRESHOLD ENFORCEMENT</text>

  <!-- C9 -->
  <rect x="410" y="700" width="480" height="28" rx="4" fill="#15140a" stroke="#ffcc00" stroke-width="1"/>
  <text x="420" y="719" fill="#ffcc00" font-size="12" font-weight="700">C9</text>
  <text x="455" y="719" fill="#ccc" font-size="11">cumNew &lt;= threshold</text>
  <text x="830" y="719" fill="#666" font-size="9" text-anchor="end">LessEqThan(64)</text>

  <!-- Section: Nullifier (C10) -->
  <rect x="390" y="760" width="520" height="100" rx="6" fill="#0a0f15" stroke="#4488ff" stroke-width="1.5"/>
  <text x="650" y="784" text-anchor="middle" fill="#4488ff" font-size="13" font-weight="700">NULLIFIER — replay prevention</text>

  <!-- C10 -->
  <rect x="410" y="796" width="480" height="50" rx="4" fill="#0a0a15" stroke="#4488ff" stroke-width="1"/>
  <text x="420" y="816" fill="#4488ff" font-size="12" font-weight="700">C10</text>
  <text x="460" y="816" fill="#ccc" font-size="11">Nullifier correctly derived (note-based)</text>
  <rect x="420" y="822" width="460" height="20" rx="3" fill="#0a0a10" stroke="#1a1a2f" stroke-width="0.5"/>
  <text x="650" y="837" text-anchor="middle" fill="#4488ff" font-size="10">Poseidon(2, userSecret, epochId, randOld) === nullifier</text>

  <!-- Section: txAmountHash (C11) -->
  <rect x="390" y="880" width="520" height="100" rx="6" fill="#150f15" stroke="#44ccff" stroke-width="1.5"/>
  <text x="650" y="904" text-anchor="middle" fill="#44ccff" font-size="13" font-weight="700">TX AMOUNT HASH — receiver verification</text>

  <!-- C11 -->
  <rect x="410" y="916" width="480" height="50" rx="4" fill="#0f0a15" stroke="#44ccff" stroke-width="1"/>
  <text x="420" y="936" fill="#44ccff" font-size="12" font-weight="700">C11</text>
  <text x="460" y="936" fill="#ccc" font-size="11">Amount hash with domain separation</text>
  <rect x="420" y="942" width="460" height="20" rx="3" fill="#0a0a10" stroke="#1a1a2f" stroke-width="0.5"/>
  <text x="650" y="957" text-anchor="middle" fill="#44ccff" font-size="10">Poseidon(3, txAmount, salt) === txAmountHash</text>

  <!-- ═══════════════ CONNECTION ARROWS ═══════════════ -->

  <!-- Private -> C1 -->
  <line x1="340" y1="105" x2="410" y2="140" stroke="#ff4444" stroke-width="0.8" marker-end="url(#arr)"/>
  <line x1="340" y1="225" x2="410" y2="140" stroke="#ff4444" stroke-width="0.8"/>
  <line x1="340" y1="305" x2="410" y2="140" stroke="#ff4444" stroke-width="0.8"/>

  <!-- Private -> C2 -->
  <line x1="340" y1="145" x2="410" y2="218" stroke="#ff4444" stroke-width="0.8" marker-end="url(#arr)"/>
  <line x1="340" y1="265" x2="410" y2="218" stroke="#ff4444" stroke-width="0.8"/>
  <line x1="340" y1="305" x2="410" y2="218" stroke="#ff4444" stroke-width="0.8"/>

  <!-- Public -> C1 -->
  <line x1="960" y1="105" x2="890" y2="140" stroke="#4488ff" stroke-width="0.8" marker-end="url(#arr-blue)"/>

  <!-- Public -> C2 -->
  <line x1="960" y1="145" x2="890" y2="218" stroke="#4488ff" stroke-width="0.8" marker-end="url(#arr-blue)"/>

  <!-- Public -> C9 (threshold) -->
  <line x1="960" y1="185" x2="890" y2="714" stroke="#ffcc00" stroke-width="0.8" marker-end="url(#arr-orange)"/>

  <!-- Public -> C10 (nullifier) -->
  <line x1="960" y1="265" x2="890" y2="820" stroke="#4488ff" stroke-width="0.8" marker-end="url(#arr-blue)"/>

  <!-- Public -> C11 (txAmountHash) -->
  <line x1="960" y1="305" x2="890" y2="940" stroke="#44ccff" stroke-width="0.8" marker-end="url(#arr-cyan)"/>

  <!-- ═══════════════ DOMAIN SEPARATION LEGEND ═══════════════ -->

  <rect x="390" y="1000" width="520" height="90" rx="6" fill="#111" stroke="#333" stroke-width="1"/>
  <text x="650" y="1024" text-anchor="middle" fill="#888" font-size="12" font-weight="600">DOMAIN SEPARATION TAGS</text>
  <line x1="405" y1="1032" x2="895" y2="1032" stroke="#222" stroke-width="0.5"/>
  <text x="430" y="1052" fill="#00ff88" font-size="11">tag 1</text>
  <text x="490" y="1052" fill="#777" font-size="10">Commitment hashes — H(1, cum, rand, secret)</text>
  <text x="430" y="1070" fill="#4488ff" font-size="11">tag 2</text>
  <text x="490" y="1070" fill="#777" font-size="10">Nullifier hashes — H(2, secret, epoch, randOld)</text>
  <text x="430" y="1088" fill="#44ccff" font-size="11">tag 3</text>
  <text x="490" y="1088" fill="#777" font-size="10">Amount hashes — H(3, amount, salt)</text>

  <!-- Poseidon detail -->
  <rect x="390" y="1100" width="520" height="34" rx="4" fill="#0f0f0f" stroke="#222" stroke-width="0.5"/>
  <text x="650" y="1122" text-anchor="middle" fill="#555" font-size="10">All hashes: Poseidon (circomlib) over BN254 scalar field Fr — ~254-bit output</text>

</svg>

<div class="legend">
  <div class="legend-item"><div class="legend-swatch" style="background:#0a150f; border-color:#00cc66;"></div><span>Commitment Integrity (C1-C2)</span></div>
  <div class="legend-item"><div class="legend-swatch" style="background:#0f0a15; border-color:#bb66ff;"></div><span>Arithmetic (C3-C4)</span></div>
  <div class="legend-item"><div class="legend-swatch" style="background:#150f0a; border-color:#ff9900;"></div><span>Range Proofs (C5-C8)</span></div>
  <div class="legend-item"><div class="legend-swatch" style="background:#15140a; border-color:#ffcc00;"></div><span>Threshold (C9)</span></div>
  <div class="legend-item"><div class="legend-swatch" style="background:#0a0a15; border-color:#4488ff;"></div><span>Nullifier (C10)</span></div>
  <div class="legend-item"><div class="legend-swatch" style="background:#0f0a15; border-color:#44ccff;"></div><span>Amount Hash (C11)</span></div>
  <div class="legend-item"><div class="legend-swatch" style="background:#150f0f; border-color:#ff4444;"></div><span>Private Inputs</span></div>
  <div class="legend-item"><div class="legend-swatch" style="background:#0f0f15; border-color:#4488ff;"></div><span>Public Inputs</span></div>
</div>
</body>
</html>
