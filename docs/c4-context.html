<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veil — C4 Level 1: System Context</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #e0e0e0;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 40px 20px;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    color: #00ff88;
    margin-bottom: 8px;
    letter-spacing: 0.05em;
  }
  .subtitle {
    font-size: 0.8rem;
    color: #666;
    margin-bottom: 40px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  svg { max-width: 1100px; width: 100%; }
  .legend {
    margin-top: 32px;
    display: flex;
    gap: 32px;
    font-size: 0.75rem;
    color: #888;
  }
  .legend-item { display: flex; align-items: center; gap: 8px; }
  .legend-swatch {
    width: 16px;
    height: 16px;
    border-radius: 3px;
    border: 1px solid #333;
  }
</style>
</head>
<body>
<h1>Veil — System Context Diagram</h1>
<p class="subtitle">C4 Level 1 &mdash; Who uses Veil and what it connects to</p>

<svg viewBox="0 0 1100 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00ff88" />
    </marker>
    <marker id="arrow-dim" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555" />
    </marker>
  </defs>

  <!-- Background grid (subtle) -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111" stroke-width="0.5"/>
  </pattern>
  <rect width="1100" height="720" fill="url(#grid)" />

  <!-- ACTOR: User -->
  <g transform="translate(180, 40)">
    <!-- Person icon -->
    <circle cx="70" cy="28" r="22" fill="none" stroke="#00ff88" stroke-width="1.5"/>
    <line x1="70" y1="50" x2="70" y2="90" stroke="#00ff88" stroke-width="1.5"/>
    <line x1="40" y1="65" x2="100" y2="65" stroke="#00ff88" stroke-width="1.5"/>
    <line x1="70" y1="90" x2="45" y2="120" stroke="#00ff88" stroke-width="1.5"/>
    <line x1="70" y1="90" x2="95" y2="120" stroke="#00ff88" stroke-width="1.5"/>
    <text x="70" y="145" text-anchor="middle" fill="#00ff88" font-size="14" font-weight="600">User</text>
    <text x="70" y="162" text-anchor="middle" fill="#888" font-size="10">Wallet holder</text>
    <text x="70" y="176" text-anchor="middle" fill="#888" font-size="10">Generates ZK proofs</text>
    <text x="70" y="190" text-anchor="middle" fill="#888" font-size="10">Sends transactions</text>
  </g>

  <!-- ACTOR: Auditor / Regulator -->
  <g transform="translate(700, 40)">
    <circle cx="70" cy="28" r="22" fill="none" stroke="#ff9900" stroke-width="1.5"/>
    <line x1="70" y1="50" x2="70" y2="90" stroke="#ff9900" stroke-width="1.5"/>
    <line x1="40" y1="65" x2="100" y2="65" stroke="#ff9900" stroke-width="1.5"/>
    <line x1="70" y1="90" x2="45" y2="120" stroke="#ff9900" stroke-width="1.5"/>
    <line x1="70" y1="90" x2="95" y2="120" stroke="#ff9900" stroke-width="1.5"/>
    <text x="70" y="145" text-anchor="middle" fill="#ff9900" font-size="14" font-weight="600">Auditor / Regulator</text>
    <text x="70" y="162" text-anchor="middle" fill="#888" font-size="10">Requests selective disclosure</text>
    <text x="70" y="176" text-anchor="middle" fill="#888" font-size="10">(Future: ElGamal Tier 2)</text>
  </g>

  <!-- SYSTEM: Veil Protocol (central) -->
  <g transform="translate(325, 300)">
    <rect x="0" y="0" width="400" height="160" rx="6" fill="#0f1f15" stroke="#00ff88" stroke-width="2"/>
    <text x="200" y="36" text-anchor="middle" fill="#00ff88" font-size="18" font-weight="700">Veil Protocol</text>
    <line x1="30" y1="50" x2="370" y2="50" stroke="#1a3a25" stroke-width="1"/>
    <text x="200" y="72" text-anchor="middle" fill="#ccc" font-size="11">Privacy payment system on Sui</text>
    <text x="200" y="90" text-anchor="middle" fill="#888" font-size="10">Cumulative spending proofs (ZK)</text>
    <text x="200" y="106" text-anchor="middle" fill="#888" font-size="10">UTXO commitments + nullifiers</text>
    <text x="200" y="122" text-anchor="middle" fill="#888" font-size="10">Tiered KYC: anonymous &lt; CHF 1K/epoch</text>
    <text x="200" y="138" text-anchor="middle" fill="#888" font-size="10">Freeze mechanism + AdminCap governance</text>
  </g>

  <!-- SYSTEM: Sui Blockchain -->
  <g transform="translate(50, 540)">
    <rect x="0" y="0" width="340" height="130" rx="6" fill="#0f0f1f" stroke="#4488ff" stroke-width="1.5"/>
    <text x="170" y="30" text-anchor="middle" fill="#4488ff" font-size="15" font-weight="600">Sui Blockchain</text>
    <line x1="20" y1="42" x2="320" y2="42" stroke="#1a1a3a" stroke-width="1"/>
    <text x="170" y="62" text-anchor="middle" fill="#ccc" font-size="10">Layer 1 — Object-centric model</text>
    <text x="170" y="78" text-anchor="middle" fill="#888" font-size="10">Hosts Move smart contracts</text>
    <text x="170" y="94" text-anchor="middle" fill="#888" font-size="10">Native Groth16 BN254 verifier</text>
    <text x="170" y="110" text-anchor="middle" fill="#888" font-size="10">Clock object for epoch calculation</text>
  </g>

  <!-- SYSTEM: Browser -->
  <g transform="translate(660, 540)">
    <rect x="0" y="0" width="340" height="130" rx="6" fill="#1f1a0f" stroke="#ffcc00" stroke-width="1.5"/>
    <text x="170" y="30" text-anchor="middle" fill="#ffcc00" font-size="15" font-weight="600">Browser</text>
    <line x1="20" y1="42" x2="320" y2="42" stroke="#3a3a1a" stroke-width="1"/>
    <text x="170" y="62" text-anchor="middle" fill="#ccc" font-size="10">Client-side application</text>
    <text x="170" y="78" text-anchor="middle" fill="#888" font-size="10">Next.js 14 frontend + dApp-kit</text>
    <text x="170" y="94" text-anchor="middle" fill="#888" font-size="10">snarkjs WASM proof generation (~2s)</text>
    <text x="170" y="110" text-anchor="middle" fill="#888" font-size="10">Encrypted private state (localStorage)</text>
  </g>

  <!-- ACTOR: Admin -->
  <g transform="translate(0, 280)">
    <circle cx="70" cy="28" r="22" fill="none" stroke="#ff4444" stroke-width="1.5"/>
    <line x1="70" y1="50" x2="70" y2="90" stroke="#ff4444" stroke-width="1.5"/>
    <line x1="40" y1="65" x2="100" y2="65" stroke="#ff4444" stroke-width="1.5"/>
    <line x1="70" y1="90" x2="45" y2="120" stroke="#ff4444" stroke-width="1.5"/>
    <line x1="70" y1="90" x2="95" y2="120" stroke="#ff4444" stroke-width="1.5"/>
    <text x="70" y="145" text-anchor="middle" fill="#ff4444" font-size="14" font-weight="600">Admin</text>
    <text x="70" y="162" text-anchor="middle" fill="#888" font-size="10">Holds AdminCap</text>
    <text x="70" y="176" text-anchor="middle" fill="#888" font-size="10">Freeze / VK update</text>
    <text x="70" y="190" text-anchor="middle" fill="#888" font-size="10">Emergency withdraw</text>
  </g>

  <!-- ARROWS -->

  <!-- User -> Veil Protocol -->
  <line x1="250" y1="235" x2="430" y2="300" stroke="#00ff88" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="310" y="258" fill="#00ff88" font-size="9" transform="rotate(-15, 310, 258)">deposit / transfer / prove</text>

  <!-- Auditor -> Veil Protocol (dashed, future) -->
  <line x1="770" y1="235" x2="620" y2="300" stroke="#555" stroke-width="1" stroke-dasharray="6,4" marker-end="url(#arrow-dim)"/>
  <text x="720" y="258" fill="#666" font-size="9" transform="rotate(15, 720, 258)">selective disclosure (future)</text>

  <!-- Admin -> Veil Protocol -->
  <line x1="145" y1="370" x2="325" y2="380" stroke="#ff4444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="365" fill="#ff4444" font-size="9">freeze / withdraw / VK update</text>

  <!-- Veil Protocol -> Sui -->
  <line x1="430" y1="460" x2="300" y2="540" stroke="#4488ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="330" y="505" fill="#4488ff" font-size="9" transform="rotate(30, 330, 505)">Move transactions</text>

  <!-- Veil Protocol -> Browser -->
  <line x1="620" y1="460" x2="750" y2="540" stroke="#ffcc00" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="710" y="495" fill="#ffcc00" font-size="9" transform="rotate(-30, 710, 495)">proof generation</text>

  <!-- Browser -> Sui (bidirectional) -->
  <line x1="660" y1="620" x2="390" y2="620" stroke="#888" stroke-width="1" marker-end="url(#arrow-dim)"/>
  <text x="525" y="612" fill="#888" font-size="9" text-anchor="middle">signed transactions via RPC</text>
</svg>

<div class="legend">
  <div class="legend-item">
    <div class="legend-swatch" style="background:#0f1f15; border-color:#00ff88;"></div>
    <span>Core System</span>
  </div>
  <div class="legend-item">
    <div class="legend-swatch" style="background:#0f0f1f; border-color:#4488ff;"></div>
    <span>External System</span>
  </div>
  <div class="legend-item">
    <div class="legend-swatch" style="background:#1f1a0f; border-color:#ffcc00;"></div>
    <span>Client Environment</span>
  </div>
  <div class="legend-item">
    <div class="legend-swatch" style="background:transparent; border-color:#555;"></div>
    <span style="color:#555;">Future (planned)</span>
  </div>
</div>
</body>
</html>
