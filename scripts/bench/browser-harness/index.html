<!doctype html>
<html>
<head><meta charset="utf-8"><title>Veil browser proving benchmark</title></head>
<body>
<pre id="out">waiting...</pre>
<script src="snarkjs.min.js"></script>
<script>
const DOMAIN_COMMITMENT = 1n;
const DOMAIN_NULLIFIER = 2n;
const DOMAIN_TX_AMOUNT = 3n;
const MERKLE_DEPTH = 20;

function stringifyInputs(inputs) {
  const out = {};
  for (const [k, v] of Object.entries(inputs)) {
    out[k] = Array.isArray(v) ? v.map((x) => x.toString()) : v.toString();
  }
  return out;
}

// Precomputed transfer witness (matches scripts/bench/circuit-bench.mjs transferWitness),
// using values hashed offline with circomlibjs Poseidon so this harness has zero
// dependencies beyond snarkjs itself.
async function main(precomputed, iterations) {
  const out = document.getElementById("out");
  const witness = stringifyInputs(precomputed);
  const results = [];
  try {
    for (let i = 0; i < iterations; i++) {
      const t0 = performance.now();
      const { proof, publicSignals } = await snarkjs.groth16.fullProve(
        witness, "transfer_js/transfer.wasm", "transfer_final.zkey",
      );
      const t1 = performance.now();
      results.push({ ms: t1 - t0, proofBytes: JSON.stringify(proof).length });
    }
    window.__BENCH_RESULT__ = { ok: true, results };
    out.textContent = JSON.stringify(window.__BENCH_RESULT__);
  } catch (err) {
    window.__BENCH_RESULT__ = { ok: false, error: String(err && err.stack || err) };
    out.textContent = JSON.stringify(window.__BENCH_RESULT__);
  }
}
window.__runBench = main;
</script>
</body>
</html>
