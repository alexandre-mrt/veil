<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>veil browser prove bench</title></head>
<body>
<pre id="out">running...</pre>
<script src="snarkjs.min.js"></script>
<script>
async function run() {
  const runs = 10;
  const inputRes = await fetch('transfer-input.json');
  const input = await inputRes.json();
  const vkRes = await fetch('transfer_vk.json');
  const vk = await vkRes.json();
  const proveTimes = [];
  const verifyTimes = [];
  for (let i = 0; i < runs; i++) {
    const t0 = performance.now();
    const { proof, publicSignals } = await snarkjs.groth16.fullProve(input, 'transfer.wasm', 'transfer_final.zkey');
    const t1 = performance.now();
    const ok = await snarkjs.groth16.verify(vk, publicSignals, proof);
    const t2 = performance.now();
    if (!ok) throw new Error('verification failed on run ' + i);
    proveTimes.push(t1 - t0);
    verifyTimes.push(t2 - t1);
  }
  const mean = (arr) => arr.reduce((a,b) => a+b, 0) / arr.length;
  const result = {
    runs,
    proveMsMean: mean(proveTimes),
    proveMsMin: Math.min(...proveTimes),
    proveMsMax: Math.max(...proveTimes),
    verifyMsMean: mean(verifyTimes),
    proveTimes,
    verifyTimes,
    userAgent: navigator.userAgent,
  };
  document.getElementById('out').textContent = JSON.stringify(result);
  window.__BENCH_RESULT__ = result;
}
run().catch(e => {
  document.getElementById('out').textContent = 'ERROR: ' + (e && e.stack || e);
  window.__BENCH_ERROR__ = String(e && e.stack || e);
});
</script>
</body>
</html>
