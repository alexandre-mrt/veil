<!doctype html>
<html>
<head><meta charset="utf-8"><title>Veil browser proving bench</title></head>
<body>
<pre id="out">running...</pre>
<script src="./snarkjs.min.js"></script>
<script>
async function run() {
  const out = document.getElementById("out");
  const log = (s) => { out.textContent += s + "\n"; console.log(s); };

  const input = await (await fetch("./transfer_bench_input.json")).json();
  const vk = await (await fetch("./transfer_vk.json")).json();

  const ITERATIONS = 5;
  const proveMs = [];
  const verifyMs = [];
  let ok = null;

  for (let i = 0; i < ITERATIONS; i++) {
    const t0 = performance.now();
    const { proof, publicSignals } = await snarkjs.groth16.fullProve(input, "./transfer.wasm", "./transfer_final.zkey");
    const t1 = performance.now();
    ok = await snarkjs.groth16.verify(vk, publicSignals, proof);
    const t2 = performance.now();
    proveMs.push(t1 - t0);
    verifyMs.push(t2 - t1);
    log(`iter ${i}: fullProve=${(t1-t0).toFixed(1)}ms verify=${(t2-t1).toFixed(1)}ms ok=${ok}`);
  }

  window.__benchResult = { proveMs, verifyMs, ok, userAgent: navigator.userAgent };
  log("DONE " + JSON.stringify(window.__benchResult));
}
run().catch(e => {
  document.getElementById("out").textContent = "ERROR: " + e.stack;
  window.__benchError = e.stack;
});
</script>
</body>
</html>
