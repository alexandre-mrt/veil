[package]
name = "veil-arkworks-spike"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ark-bn254 = "0.5"
ark-ff = "0.5"
ark-ec = "0.5"
ark-groth16 = { version = "0.5", default-features = false, features = ["parallel"] }
ark-r1cs-std = "0.5"
ark-relations = "0.5"
ark-serialize = "0.5"
ark-snark = "0.5"
ark-std = { version = "0.5", features = ["parallel"] }
ark-crypto-primitives = { version = "0.5", features = ["sponge"] }
light-poseidon = "0.4"
hex = "0.4"

[profile.release]
opt-level = 3
